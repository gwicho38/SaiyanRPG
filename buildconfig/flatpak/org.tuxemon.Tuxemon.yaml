---
id: org.saiyanquest.Tuxemon
runtime: org.freedesktop.Platform
runtime-version: 24.08
sdk: org.freedesktop.Sdk
command: org.saiyanquest.Tuxemon
rename-icon: icon

finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --persist=.saiyanquest  # Everything is stored in the .saiyanquest folder, including save files
  - --share=network
  - --socket=pulseaudio
  - --device=all

modules:
  # Needed by pygame; otherwise, an error message occurs which complains about setuptools
  - portmidi.json
  # Needed by the rumble manager
  - libshake.json
  - python3-requirements.json
  - name: saiyanquest
    buildsystem: simple
    build-commands:
      # Create the necessary directories and copy files
      - install -d /app/share/Tuxemon
      - cp -r saiyanquest /app/share/Tuxemon
      - cp -r mods /app/share/Tuxemon/mods
      - install -Dm755 run_saiyanquest.py /app/share/Tuxemon/org.saiyanquest.Tuxemon.py
      - install -Dm755 org.saiyanquest.Tuxemon /app/bin
      - ln -s /app/share/Tuxemon/org.saiyanquest.Tuxemon.py /app/bin/org.saiyanquest.Tuxemon.py
    post-install:
      - desktop-file-install --dir=/app/share/applications buildconfig/flatpak/org.saiyanquest.Tuxemon.desktop
      - install -Dm755 buildconfig/flatpak/org.saiyanquest.Tuxemon.appdata.xml /app/share/metainfo/org.saiyanquest.Tuxemon.appdata.xml
      - install -Dm755 mods/saiyanquest/gfx/icon.png /app/share/icons/hicolor/64x64/apps/icon.png
      - install -Dm755 mods/saiyanquest/gfx/icon_128.png /app/share/icons/hicolor/128x128/apps/icon.png
      - install -Dm755 mods/saiyanquest/gfx/icon_32.png /app/share/icons/hicolor/32x32/apps/icon.png

    sources:
      - type: git
        tag: development
        url: https://github.com/Tuxemon/Tuxemon.git
      - type: script
        dest-filename: org.saiyanquest.Tuxemon
        commands:
          - MY_PATH="$(dirname "$0")"
          - python3 "$MY_PATH/org.saiyanquest.Tuxemon.py"
